alias: Amber - SPT Heat Pump Energy Optimiser
description: >-
  Amber Edition: Watchdog protected. Optimises hot water by soaking excess solar
  (prioritising battery on low Forecast.Solar days <12kWh) and negative Amber
  grid prices up to 65°C. Uses 98% battery capacity as a curtailment proxy.
  Protects against grid price spikes while enforcing 40°C floor.
triggers:
  - id: turn_up_solar
    entity_id: sensor.sigen_plant_grid_export_power
    above: 0.8
    for:
      minutes: 10
    trigger: numeric_state
  - id: turn_up_solar
    entity_id: sensor.sigen_plant_battery_power
    above: 0.8
    for:
      minutes: 10
    trigger: numeric_state
  - id: turn_up_solar
    entity_id: sensor.sigen_plant_battery_state_of_charge
    above: 98
    for:
      minutes: 5
    trigger: numeric_state
  - id: turn_up_solar
    entity_id: sensor.spt_current_temperature
    below: 59
    for:
      minutes: 5
    trigger: numeric_state
  - id: turn_up_negative_price
    entity_id: sensor.amber_general_price
    below: input_number.amber_negative_soak_price
    trigger: numeric_state
  - id: turn_up_negative_price
    entity_id: switch.spt_power
    to: 'off'
    for:
      minutes: 1
    trigger: state
  - id: temp_low_recovery
    entity_id: switch.spt_power
    to: 'off'
    trigger: state
  - id: turn_down
    entity_id: sensor.sigen_plant_battery_power
    below: -0.354
    for:
      minutes: 10
    trigger: numeric_state
  - id: turn_down
    entity_id: sensor.sigen_plant_battery_state_of_charge
    below: input_number.battery_reserve_state_of_charge
    for:
      minutes: 2
    trigger: numeric_state
  - id: turn_down
    entity_id: sensor.amber_general_price
    above: input_number.amber_negative_soak_price
    trigger: numeric_state
  - id: price_spike
    entity_id: sensor.amber_general_price
    above: 0.4
    trigger: numeric_state
  - id: rogue_reset
    entity_id: number.spt_target_temperature
    above: 54
    below: 56
    for:
      minutes: 0
      seconds: 30
    trigger: numeric_state
  - id: temp_low
    entity_id: sensor.spt_current_temperature
    below: 40
    for:
      minutes: 2
    trigger: numeric_state
  - id: temp_restored
    entity_id: sensor.spt_current_temperature
    above: 40.5
    for:
      minutes: 2
    trigger: numeric_state
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: rogue_reset
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: unavailable
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.spt_power
                      state: 'on'
                    - condition: template
                      value_template: '{{ repeat.index >= 2 }}'
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.spt_power
                - action: number.set_value
                  target:
                    entity_id: number.spt_target_temperature
                  data:
                    value: 65
                - delay:
                    seconds: 15
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: switch.spt_power
                    state: 'on'
            then:
              - action: persistent_notification.create
                data:
                  title: ⚠️ Heat Pump Sync Failed (Rogue Reset)
                  message: >-
                    Failed to fix rogue temperature reset after 2 attempts.
                    Local connection is unresponsive. Manual override required.
            else:
              - action: persistent_notification.create
                data:
                  title: SPT Heat Pump corrected
                  message: >-
                    Target temperature auto-reset to 55 detected. Instantly
                    fixed back to 65.
                  notification_id: spt_heat_pump_auto_fix
      - conditions:
          - condition: trigger
            id:
              - temp_low
              - temp_low_recovery
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: unavailable
          - condition: numeric_state
            entity_id: sensor.spt_current_temperature
            below: 40
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.spt_power
                      state: 'on'
                    - condition: template
                      value_template: '{{ repeat.index >= 2 }}'
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.spt_power
                - action: number.set_value
                  target:
                    entity_id: number.spt_target_temperature
                  data:
                    value: 65
                - delay:
                    seconds: 15
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: switch.spt_power
                    state: 'on'
            then:
              - action: persistent_notification.create
                data:
                  title: ⚠️ Heat Pump Sync Failed (Cold Water)
                  message: >-
                    Failed to turn the heat pump ON to recover cold water after
                    2 attempts. Local connection is unresponsive. Manual
                    override required.
      - conditions:
          - condition: trigger
            id: turn_up_negative_price
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: unavailable
          - condition: numeric_state
            entity_id: sensor.amber_general_price
            below: input_number.amber_negative_soak_price
          - condition: numeric_state
            entity_id: sensor.spt_current_temperature
            below: 65
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.spt_power
                      state: 'on'
                    - condition: template
                      value_template: '{{ repeat.index >= 2 }}'
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.spt_power
                - action: number.set_value
                  target:
                    entity_id: number.spt_target_temperature
                  data:
                    value: 65
                - delay:
                    seconds: 15
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: switch.spt_power
                    state: 'on'
            then:
              - action: persistent_notification.create
                data:
                  title: ⚠️ Heat Pump Sync Failed (Negative Price Soak)
                  message: >-
                    Failed to turn the heat pump ON for negative price soaking
                    after 2 attempts. Local connection is unresponsive. Manual
                    override required.
      - conditions:
          - condition: trigger
            id: turn_up_solar
          - condition: time
            after: '06:00:00'
            before: '17:00:00'
          - condition: state
            entity_id: switch.sigen_plant_remote_ems_controlled_by_home_assistant
            state: 'off'
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: unavailable
          - condition: numeric_state
            entity_id: sensor.sigen_plant_battery_state_of_charge
            above: input_number.battery_reserve_state_of_charge
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.energy_production_today_remaining
                above: 12
              - condition: numeric_state
                entity_id: sensor.sigen_plant_battery_state_of_charge
                above: 75
          - condition: numeric_state
            entity_id: sensor.amber_general_price
            below: 0.35
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.sigen_plant_grid_export_power
                above: 0.8
              - condition: numeric_state
                entity_id: sensor.sigen_plant_battery_power
                above: 0.8
              - condition: numeric_state
                entity_id: sensor.sigen_plant_battery_state_of_charge
                above: 98
          - condition: numeric_state
            entity_id: sensor.spt_current_temperature
            below: 65
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.spt_power
                      state: 'on'
                    - condition: template
                      value_template: '{{ repeat.index >= 2 }}'
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.spt_power
                - action: number.set_value
                  target:
                    entity_id: number.spt_target_temperature
                  data:
                    value: 65
                - delay:
                    seconds: 15
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: switch.spt_power
                    state: 'on'
            then:
              - action: persistent_notification.create
                data:
                  title: ⚠️ Heat Pump Sync Failed (Solar)
                  message: >-
                    Failed to turn the heat pump ON for solar soaking after 2
                    attempts. Local connection is unresponsive. Manual override
                    required.
      - conditions:
          - condition: trigger
            id:
              - turn_down
              - temp_restored
              - price_spike
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: unavailable
          - condition: numeric_state
            entity_id: sensor.spt_current_temperature
            above: 40.4
          - condition: not
            conditions:
              - condition: numeric_state
                entity_id: sensor.amber_general_price
                below: input_number.amber_negative_soak_price
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.amber_general_price
                above: 0.4
              - condition: numeric_state
                entity_id: sensor.sigen_plant_battery_power
                below: -0.354
              - condition: numeric_state
                entity_id: sensor.sigen_plant_battery_state_of_charge
                below: input_number.battery_reserve_state_of_charge
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.spt_power
                state: 'off'
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: switch.spt_power
                      state: 'off'
                    - condition: template
                      value_template: '{{ repeat.index >= 2 }}'
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.spt_power
                - action: number.set_value
                  target:
                    entity_id: number.spt_target_temperature
                  data:
                    value: 38
                - delay:
                    seconds: 15
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: switch.spt_power
                    state: 'off'
            then:
              - action: persistent_notification.create
                data:
                  title: ⚠️ Heat Pump Sync Failed (Turn OFF)
                  message: >-
                    Failed to turn the heat pump OFF after 2 attempts. Local
                    connection is unresponsive. Manual override required.
mode: queued
max: 5
